name: Docs Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate public governance surface
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install pinned Python validation tools
        run: python -m pip install --disable-pip-version-check --requirement requirements-docs.txt

      - name: Run validator tests
        run: python -m unittest discover -s tests -v

      - name: Validate public surface, links, JSON, schemas, and workflow syntax
        run: python scripts/validate_public_surface.py --check all

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install locked Markdown tooling without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Lint Markdown
        run: npm run lint:markdown

      - name: Check external links with bounded retries and timeouts
        run: python scripts/validate_public_surface.py --check external
